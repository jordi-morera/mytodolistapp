<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Task List</title>
    <link rel="stylesheet" type="text/css" th:href="@{/styles.css}"/>
</head>
<body>
<h1>Task List</h1>
<a href="#" th:href="@{/new}">Create Task</a>
<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Created Date</th>
        <th>ETA</th>
        <th>Finished</th>
        <th>Task Status</th>
        <th>Actions</th>
    </tr>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.title}"></td>
        <td th:text="${task.description}"></td>
        <td th:text="${task.createdDate}"></td>
        <td th:text="${task.eta}"></td>
        <td th:text="${task.finished}"></td>
        <td th:text="${task.taskStatus}"></td>
        <td>
            <a class="mark-finished" th:if="${!task.finished}" th:attr="data-task-id=${task.id}"
               th:href="@{'/tasks/mark_as_finished/' + ${task.id}}">Mark as Finished</a>
            <a class="delete-task" th:attr="data-task-id=${task.id}"
               th:href="@{'/tasks/' + ${task.id}}">Delete</a>
        </td>
    </tr>
</table>
<script th:src="@{/app.js}"></script>
</body>
</html>
